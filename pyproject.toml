[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jseasy"
version = "0.1.0"
description = "jsEasy (jseasy): a lightweight Python scraping runtime that executes JavaScript against a small DOM without launching a browser."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["scraping", "javascript", "dom", "html", "quickjs", "crawler", "jseasy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "quickjs>=1.19",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jseasy"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
